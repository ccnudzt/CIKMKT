data_params:
  min_len: 3
  max_len: 200

model_params:
  embed_dim: 128
  hidden_dim: 256

text_embed:
  enabled: true                   # set to false to use original ID embedding
  model_path: "~/model_weights/Qwen-Embedding/Qwen3-Embedding-0.6B/"
  encode_batch_size: 128         # texts per inference batch
  agg: "mean"                     # how to aggregate 3 cog texts: mean | sum | max

exp_params:
  device: "cuda"       # Resolve to cuda/cpu dynamically in main.py
  batch_size: 512
  num_epochs: 100
  lr: 0.01
  seed: 42
  num_folds: 5
  patience: 10          # stop if no improvement for N epochs
  min_delta: 0.0001    # minimum change to qualify as improvement
  ckpt_dir: "checkpoints"
  save_last: true
  eta_min: 0.000001    # min lr for cosine annealing